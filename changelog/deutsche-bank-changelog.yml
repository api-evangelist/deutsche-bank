description: >-
  Deutsche Bank publishes a dated release-notes archive for the dbAPI platform going back
  to 2020, on a roughly six-to-eight week cadence, numbered YYYY.NN. The recent window is
  structured below; the full archive is on the portal. Notes are narrative rather than
  per-endpoint diffs, and Deutsche Bank states backward compatibility explicitly when a
  change is additive.
scheme: 'YYYY.NN'
years_published: ["2026", "2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018"]
