- aid: deutsche-bank:merchant-solutions
  name: Deutsche Bank Merchant Solutions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/deutsche-bank.png
  description: 'Merchant Solutions is the payment acceptance and issuing product portfolio of Deutsche
    Bank - the Merchant-Server II REST platform behind Deutsche Bank''s payment gateway. Three contracts
    are published through the Deutsche Bank developer portal: a Security API that mints the bearer
    JWT, a Services API carrying the transaction, alias, mandate and reporting surface (54 operations
    at v2.1), and a signed Callback API describing the webhook a merchant must implement. The declared
    hosts are the platform''s own directpos.de test endpoints, which is why they differ from db.com.'
  humanURL: https://developer.db.com/products/payment-acceptance
  baseURL: https://testmerch.directpos.de/rest-api
