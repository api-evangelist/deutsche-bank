- aid: deutsche-bank:deutsche-bank
  name: Deutsche Bank API Program
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/deutsche-bank.png
  description: The Deutsche Bank API Program (dbAPI) - 30 published OpenAPI contracts covering cash
    accounts, transactions and transaction analysis, credit cards, SEPA credit transfer, instant
    credit transfer and direct debit, securities accounts, assets, performance, orders and reports,
    consumer loan offers, cash and securities account opening, processing orders, reference data
    (partners, addresses, age certificate, customer verification, solvency), PSD2 strong customer
    authentication, and an event notification service. Contracts are served from Deutsche Bank's
    own public swagger catalogue and the same operations run for the Deutsche Bank, norisbank and
    Postbank tenants.
