aid: deutsche-bank
name: Deutsche Bank
url: https://raw.githubusercontent.com/api-evangelist/deutsche-bank/refs/heads/main/apis.yml
type: Index
description: 'Deutsche Bank is a global financial institution headquartered in Frankfurt, providing
  retail, corporate and investment banking, asset management and wealth management. Its developer
  programme - dbAPI, published at developer.db.com - goes well beyond the PSD2 regulatory minimum:
  36 first-party OpenAPI 3.0.x contracts covering 195 operations across banking, cards, payments,
  investments, lending, onboarding, reference data and merchant acquiring, all retrievable from Deutsche
  Bank''s own public swagger catalogue. The same contracts serve three tenants - Deutsche Bank, norisbank
  and Postbank. Access is OAuth 2.0 / OpenID Connect with 42 published scopes, PSD2 strong customer
  authentication exposed as its own API, a free self-service simulation gateway with persona-based
  test users, and a reviewed go-live process for production data.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/deutsche-bank.png
