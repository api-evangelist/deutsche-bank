        status: 404
      - path: /gw/oidc/.well-known/oauth-authorization-server
        status: 404
      - path: /gw/oidc/.well-known/oauth-protected-resource
        status: 404
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/api-catalog
        status: 404
      - path: /.well-known/agent-card.json
        status: 404
      - path: /.well-known/agent.json
        status: 404
  - host: cidp-eu.db.com
