        status: 404
      - path: /.well-known/agent.json
        status: 404
  - host: simulator-api.db.com
    documents:
      - path: /gw/oidc/.well-known/openid-configuration
        status: 200
        file: deutsche-bank-simulator-openid-configuration.json
        note: >-
          Real OIDC discovery document for the dbAPI OAuth provider. issuer
          https://simulator-api.db.com/gw/oidc/. Published under the gateway product root,
