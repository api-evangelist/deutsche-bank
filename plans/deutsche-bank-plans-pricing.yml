description: >-
  Deutsche Bank publishes NO priced plans for the dbAPI programme. It publishes exactly one
  commercial statement, in its own FAQ: registration and simulation are free of charge, and
  commercial terms for production use of live data are negotiated bilaterally. This file
  replaces a 2026-05-04 bulk-sweep scaffold that invented Free / Professional / Enterprise
  tiers with fabricated quotas and prices; none of those tiers exist.
plan_count: 0
pricing_page: null
pricing_model: contact-sales
published_statement: >-
  "What does it cost to use the Deutsche Bank API Program? Signing up to the Developer Portal
  and testing with it is free of charge (so you can put your wallet away). Deutsche Bank may
  agree on appropriate fees for use of the Deutsche Bank API Program live data with
  third-party providers through a separate agreement."
statement_source: https://developer.db.com/faq
tiers_observed:
  - name: Developer Portal and simulation
    price: free
    detail: >-
      Portal registration, test users, test data and the full simulation gateway at
      simulator-api.db.com are free of charge and self-service. No card, no quota published.
    gated: false
  - name: Production (live data)
    price: negotiated
    detail: >-
      Access to live customer data requires an approved go-live request and, for third-party
      providers, a separate commercial agreement. Fees, if any, are set in that agreement and
      are not published.
    gated: true
    gate: go-live request reviewed by Deutsche Bank
notes:
  - No pricing page exists on developer.db.com - the portal has no /pricing route.
  - No metered or per-call price is published anywhere in the developer surface.
  - This is normal for a regulated bank's open-banking programme and is NOT a coverage gap.
