      properties:
        date_from:
          type: string
          description: Starting date of the transaction list. Full-date notation as defined by RFC 3339, section 5.6.
          format: date
          example: '2021-07-13'
        date_to:
          type: string
          description: End date of the transaction list. Full-date notation as defined by RFC 3339, section 5.6.
          format: date
          example: '2021-07-14'
        booking_status:
          type: array
          description: The requested booking status(es). Not all banks allow `PENDING` or `BOOKED` and `PENDING`.
          example:
          - BOOKED
          items:
            type: string
            description: 'Booking status of a transaction


              * `BOOKED`

              * `PENDING`'
            example: BOOKED
            enum:
            - BOOKED
            - PENDING
      description: 'Contains properties to filter the transactions if `requested_details` includes `TRANSACTIONS`.

        If `booking_status` is not submitted `BOOKED` transactions will be requested from the customer''s bank.'
    RiskCheckPassenger:
      type: object
      properties:
        type:
          type: string
          description: 'Passenger classification as indicated by the price discount class of the ticket. The following values are valid:


            * `ADT`: Adult

            * `CNN`: Child

            * `INF`: Infant

            * `YTH`: Youth

            * `STU`: Student

            * `SCR`: Senior Citizen

            * `MIL`: Military

            '
          example: ADT
          enum:
          - ADT
          - CNN
          - INF
          - YTH
          - STU
          - SCR
          - MIL
        status:
          maxLength: 32
          minLength: 0
          type: string
          description: Merchant specific passenger classification, such as standard, gold, or platinum.
          example: standard
        phone:
          $ref: '#/components/schemas/PhoneContact'
        first_name:
          maxLength: 60
          minLength: 0
          type: string
          description: First name of the individual.
          example: Jane
        last_name:
          maxLength: 60
          minLength: 0
          type: string
          description: Last name of the individual.
          example: Doe
        id:
          maxLength: 40
          minLength: 0
          type: string
          description: ID of the passenger to whom a ticket was issued. For example, this field may contain the frequent flyer number.
          example: B7564
        email:
          maxLength: 255
          minLength: 0
          type: string
          description: Email address of the individual.
          example: test_jane@gmail.com
        country:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: The ISO 3166 Alpha-2 country code (upper case) of the individual's homeland.
          example: DE
      description: A (plane) passenger as modelled from the point of view of a risk check service.
    DeviceInformation:
      type: object
      properties:
        cookies_accepted:
          type: boolean
          description: Whether or not the browser accepts cookies.
          example: true
        http_accept_browser_value:
          maxLength: 2048
          minLength: 0
          type: string
          description: 'Value of the ''Accept'' header sent by the customer''s web browser. Note: If the customer''s browser provides a value, you must include it with your request.'
          example: text/html, application/xhtml+xml, application/xml;q=0.9, image/webp, */*;q=0.8
        http_accept_content:
          maxLength: 2048
          minLength: 0
          type: string
          description: The exact content of the HTTP accept header.
          example: text/html, application/xhtml+xml, application/xml;q=0.9, image/webp, */*;q=0.8
        color_depth:
          type: string
          description: "The bit depth of the color palette for displaying images, in bits per pixel. See https://en.wikipedia.org/wiki/Color_depth. Possible values:\n\n* `B1`\n* `B4`\n* `B8`\n* `B15`\n* `B16`\n* `B24`\n* `B32`\n* `B48`\n\n    "
          example: B24
          enum:
          - B1
          - B4
          - B8
          - B15
          - B16
          - B24
          - B32
          - B48
        http_browser_email:
          maxLength: 255
          minLength: 0
          type: string
          description: Email address set in the customer's browser. May differ from customer's actual email.
          example: mustermann@example.com
        http_browser_java_enabled:
          type: boolean
          description: Is the browser able to execute Java. Value is taken from the navigator.javaEnabled property.
          example: false
        http_browser_java_script_enabled:
          type: boolean
          description: 'Is the browser able to execute JavaScript. Background: Merchants may want to fingerprint a cardholder''s browser.'
          example: false
        http_browser_language:
          maxLength: 8
          minLength: 0
          type: string
          description: Browser language as defined in IETF BCP47. See https://en.wikipedia.org/wiki/IETF_language_tag.
          example: en-US
        http_browser_screen_height:
          minimum: 0
          type: integer
          description: Total height of the client's screen in pixels.
          format: int32
          example: 864
        http_browser_screen_width:
          minimum: 0
          type: integer
          description: Total width of the client's screen in pixels.
          format: int32
          example: 1536
        http_browser_time_difference:
          maximum: 1440
          minimum: -1440
          type: integer
          description: Time difference between UTC time and the client's browser's local time in minutes.
          format: int32
          example: 300
        ip_address:
          maxLength: 45
          minLength: 0
          pattern: ((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*$)|(^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))
          type: string
          description: IP address of the client. Both IPv4 and IPv6 are supported.
          example: 192.168.0.1
        user_agent:
          maxLength: 40
          minLength: 0
          type: string
          description: Client's browser as identified by the HTTP header data.
          example: Mozilla
        user_agent_browser_value:
          maxLength: 255
          minLength: 0
          type: string
          description: Value of the User-Agent header sent by the client's browser.
          example: Mozilla/5.0 (X11; Linux x86_64; rv:78.0) Gecko/20100101 Firefox/78.0
      description: Technical details of a client.
    TDS20CustomerData:
      type: object
      properties:
        billing_address:
          $ref: '#/components/schemas/TDS20Address'
        shipping_address:
          $ref: '#/components/schemas/TDS20Address'
        home_phone_number:
          $ref: '#/components/schemas/TDS20PhoneNumber'
        mobile_phone_number:
          $ref: '#/components/schemas/TDS20PhoneNumber'
        work_phone_number:
          $ref: '#/components/schemas/TDS20PhoneNumber'
        cardholder_account_info:
          $ref: '#/components/schemas/TDS20CardHolderAccountInfo'
        cardholder_email:
          type: string
        addresses_match:
          type: string
          enum:
          - MATCHES
          - DOES_NOT_MATCH
    FormDirectDebitData:
      required:
      - mandate
      type: object
      properties:
        mandate:
          $ref: '#/components/schemas/EnhancedMandate'
        address:
          $ref: '#/components/schemas/CommonAddress'
        due_date:
          type: string
          description: 'Due date of a direct debit payment. Full-date notation as defined by

            RFC 3339, section 5.6. The due date has to be at least three TARGET2 business days (not on weekends or the so

            called TARGET2 or TARGET holidays) after the current date. If you leave this field empty the direct debit is carried

            out as soon as possible.'
          format: date
        debit_method:
          type: string
          description: "Direct debit method. If not specified, an SDD will be carried out.\n\n\n* `SDD`: SEPA Core Direct Debit\n* `B2B`: SEPA Business to Business Direct Debit\n\n\n    "
          example: B2B
          enum:
          - SDD
          - B2B
        processing_options:
          type: array
          description: Defines an additional processing option for direct debit.
          example:
          - CHECKLIST
          - RISKCHECK
          items:
            type: string
            description: "Additional processing option for direct debit.\n\n* `CHECKLIST`: before the direct debit a blacklist is checked. Only available if this\noption has been activated for the shop.\n* `RISKCHECK`: before the direct debit a risk check is performed. Only available if this \noption has been activated for the shop.\n    "
            example: CHECKLIST
            enum:
            - CHECKLIST
            - RISKCHECK
      description: Data to initialize a direct debit form service interaction.
    BasketItemRiskCheckData:
      type: object
      properties:
        riskcheck_type:
          type: string
          description: 'Riskcheck specific type of an order item.


            * `ADULT_CONTENT`: Adult content.

            * `COUPON`: Coupon applied to the entire order.

            * `DEFAULT`: Default value for the product code. This value is used if a request message does not include a value for the product code.

            * `ELECTRONIC_GOOD`: Electronic product other than software.

            * `ELECTRONIC_SOFTWARE`: Software distributed electronically rather than on physical media.

            * `GIFT_CERTIFICATE`: Gift certificate.

            * `HANDLING_ONLY`: A fee that covers the merchant''s administrative selling costs.

            * `SERVICE`: An arbitrary service that a merchant performs for customers.

            * `SHIPPING_ONLY`: Charge for transporting tangible personal property from the merchant to the customer.

            * `SHIPPING_AND_HANDLING`: Handling & Shipping fees combined.

            * `SUBSCRIPTION`: Subscription to a website or other type of subscribable content.'
          example: SHIPPING_ONLY
          enum:
          - ADULT_CONTENT
          - COUPON
          - DEFAULT
          - ELECTRONIC_GOOD
          - ELECTRONIC_SOFTWARE
          - GIFT_CERTIFICATE
          - HANDLING_ONLY
          - SERVICE
          - SHIPPING_ONLY
          - SHIPPING_AND_HANDLING
          - SUBSCRIPTION
        distributor_product_sku:
          maxLength: 15
          minLength: 0
          type: string
          description: Product's identifier code.
          example: '12345678'
        gift_card_currency:
          type: string
          description: If riskcheck_type is GIFT_CERTIFICATE, this field must contain the ISO-4217-3 alpha-numeric currency code used for the gift card purchase.
          example: EUR
        product_risk:
          type: string
          description: 'Indicates the product''s risk level. This field may contain one of the following values:


            * `LOW`: The product is associated with a low number of chargebacks.

            * `NORMAL`: The product is associated with a normal number of chargebacks.

            * `HIGH`: The product is associated with a high number of chargebacks.

            '
          example: NORMAL
          enum:
          - LOW
          - NORMAL
          - HIGH
        risk_check_passenger:
          $ref: '#/components/schemas/RiskCheckPassenger'
        shipping_destination_types:
          type: string
          description: "Destination to where the item will be shipped.\n                \n* `COMMERCIAL`\n* `RESIDENTIAL`\n* `STORE`\n"
          example: RESIDENTIAL
          enum:
          - COMMERCIAL
          - RESIDENTIAL
          - STORE
        is_gift:
          type: boolean
          description: 'If billing and shipping addresses are different:


            true: Order risk increases slightly.

            false: Order risk increases significantly.

            '
          example: true
      description: Service specific basket item fields for riskcheck related use cases.
    RiskmanagementTravelInformationLeg:
      type: object
      properties:
        origination:
          maxLength: 3
          minLength: 0
          type: string
          description: 'Use to specify the airport code for the origin of the leg of the trip, which is designated by the pound (#) symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco. Do not use the colon (:) or the dash (-). For airport codes, see the IATA Airline and Airport Code Search.'
          example: SFO
        destination:
          maxLength: 3
          minLength: 0
          type: string
          description: 'Use to specify the airport code for the destination of the leg of the trip, which is designated by the pound (#) symbol in the field name. This code is usually three digits long, for example: SFO = San Francisco. Do not use the colon (:) or the dash (-). For airport codes, see the IATA Airline and Airport Code Search.'
          example: LHR
        carrier_code:
          maxLength: 2
          minLength: 0
          type: string
          description: International Air Transport Association (IATA) code for the carrier for this leg of the trip. Required for each leg.
          example: LH
        departure_date:
          maxLength: 8
          minLength: 8
          type: string
          description: Departure date for the first leg of the trip.
          example: '20240212'
      description: Information about a leg of the complete journey.
    PaymentResponse:
      required:
      - event_id
      - message
      - rc
      - timestamp
      - tx_id
      type: object
      properties:
        rc:
          type: string
          description: Response code of the transaction. "0" in the case of a successful transaction. Other values signify errors.
          example: '0'
        message:
          type: string
          description: Success or error message, text for the response code.
          example: Transaction approved.
        event_id:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
          description: A unique ID for the event.
          example: E5686585867636541231230
        tx_id:
          type: string
          description: Unique transaction identifier. Can be used to reference this transaction.
          example: 020LMG10jxSI8FN0OC4vLR
        riskmanagement_info:
          $ref: '#/components/schemas/RiskmanagementInfoResponse'
        amount_total:
          $ref: '#/components/schemas/AmountCurrency'
        kind:
          type: string
          description: The type of transaction.
          enum:
          - DIRECTDEBIT
          - CREDITCARD
          - CREDITCARD_3DS20
          - CREDITTRANSFER
          - SOFORTUEBERWEISUNG
          - PAYPAL
          - PAYDIREKT
          - WECHATPAY
          - P24
          - GIROPAY
          - KLARNA
          - PSD2
        tx_action:
          type: string
          description: The action of a transaction.
          enum:
          - authorization
          - capture
          - credit
          - preauthorization
          - refund
          - reversal
          - risk_check
          - verify-mop
          - payment
          - avs
          - avspayment
        alias_info:
          $ref: '#/components/schemas/AliasInfo'
        back_rc:
          maxLength: 255
          minLength: 0
          type: string
          description: Response code of a backend system, for example the GICC response code.
          example: '00'
        timestamp:
          type: string
          description: Timestamp of the transaction.
          format: date-time
        transaction_info:
          $ref: '#/components/schemas/TransactionInfo'
    FormKlarnaData:
      type: object
      description: Data to initialize a Klarna form service interaction. Currently contains no fields. See the user guide for when to generate this object.
    AliasInfo:
      type: object
      properties:
        alias:
          type: string
          description: Name of the alias.
          example: da2c9029-b180-42a7-b473-50d182a01f8a
        credit_card:
          $ref: '#/components/schemas/CreditCardInfo'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        address:
          $ref: '#/components/schemas/CommonAddress'
      description: Contains information about the created or updated alias. This field is null if the there was no 'alias_info' in the request.
    FormPSD2AccountInfoRequest:
      required:
      - form_customer_continuation
      type: object
      properties:
        bic:
          maxLength: 11
          minLength: 11
          pattern: '[A-Z]{6}[A-Z2-9][A-NP-Z0-9][A-Z0-9]{3}'
          type: string
          description: The business identifier code (BIC) of the bank. Identifies the bank if `bank_id` is not submitted.
          example: VZVDDED1XXX
        bank_code:
          maxLength: 8
          minLength: 8
          pattern: '[0-9]{8}'
          type: string
          description: 'The bank code (Bankleitzahl, BLZ) of the bank. In rare cases the bank code is required in

            addition to the BIC to identify the bank.'
          example: '38011000'
        bank_id:
          maxLength: 16
          minLength: 1
          pattern: '[A-Za-z0-9_-]+'
          type: string
          description: The ID of a bank as returned in the response of a previous bank search.
          example: bG0E
        requested_details:
          type: array
          description: To request additional details of the bank account, for example the owner.
          example:
          - OWNER
          items:
            type: string
            description: 'Specifies which additional bank account details are requested.


              * `OWNER`: the account owner

              * `BALANCE`: the account balance,

              * `TRANSACTIONS`: transactions of the bank account'
            example: OWNER
            enum:
            - OWNER
            - BALANCE
            - TRANSACTIONS
        form_data:
          $ref: '#/components/schemas/FormData'
        form_customer_continuation:
          $ref: '#/components/schemas/FormCustomerContinuation'
        callback:
          $ref: '#/components/schemas/Callback'
        transaction_filter:
          $ref: '#/components/schemas/PSD2TransactionFilter'
      description: Includes data to find a customer's bank account details.
    GiropayLabelledText:
      required:
      - label
      - text
      type: object
      properties:
        label:
          pattern: ^[a-zA-Z0-9 ']{0,30}$
          type: string
          description: Will be prefixing the value of the text field.
          example: Merchant name
        text:
          pattern: ^[a-zA-Z0-9 ']{0,80}$
          type: string
          description: Optional line of text that will be included into the giropay login page.
          example: Merchant's fine goods
      description: Additional line of text that will be included into the giropay login page.
    TaxInfo:
      required:
      - tax_id
      - tax_id_type
      type: object
      properties:
        tax_id:
          type: string
          description: The customer's tax ID value.
          example: 867.226.847-41
        tax_id_type:
          type: string
          description: 'Type of tax ID. May be country specific. Different types may adhere to different patterns.


            * `BR_CPF` : Brazilian individual tax id type.

            * `BR_CNPJ` : Brazilian business tax id type.

            * `OTHER` : None of the above.

            '
          example: BR_CPF
          enum:
          - BR_CPF
          - BR_CNPJ
          - OTHER
      description: Legal tax information of the payer.
    BasketItem:
      type: object
      properties:
        name:
          maxLength: 127
          minLength: 0
          type: string
          description: Descriptive name of the order item. Mandatory for PayPal.
          example: A fine shirt
        description:
          maxLength: 127
          minLength: 0
          type: string
          description: Used for storing merchant's internal order number or other reference.
          example: BI123456
        reference:
          maxLength: 64
          minLength: 0
          type: string
          description: Article number, SKU or similar.
          example: UGG-BB-PUR-06
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit_price:
          $ref: '#/components/schemas/TaxedAmountCurrency'
        item_discount:
          $ref: '#/components/schemas/TaxedAmountCurrency'
        extensions:
          $ref: '#/components/schemas/BasketItemExtensions'
      description: A purchasable item that is part of a shopping basket's list of items.
    FormCheckoutConfiguration:
      required:
      - checkout_entry_sorting_order
      type: object
      properties:
        credit_card_data:
          $ref: '#/components/schemas/FormCheckoutCreditCardData'
        google_pay_credit_card_data:
          $ref: '#/components/schemas/FormCheckoutCreditCardData'
        direct_debit_data:
          $ref: '#/components/schemas/FormDirectDebitData'
        request_to_pay_data:
          $ref: '#/components/schemas/FormRequestToPayData'
        sofort_data:
          $ref: '#/components/schemas/FormSofortUeberweisungData'
        paypal_data:
          $ref: '#/components/schemas/FormPayPalData'
        giropay_data:
          $ref: '#/components/schemas/FormGiropayData'
        paydirekt_data:
          $ref: '#/components/schemas/FormPaydirektData'
        klarna_data:
          $ref: '#/components/schemas/FormKlarnaData'
        psd2_pis_data:
          $ref: '#/components/schemas/FormPSD2PaymentData'
        checkout_entry_sorting_order:
          type: array
          items:
            type: string
            description: "The order in which the payment methods of the checkout_page_configuration are displayed. Possible values:     \n           \n* `CREDITCARD`\n* `DIRECTDEBIT`\n* `REQUEST_TO_PAY`\n* `SOFORTUEBERWEISUNG`\n* `PAYPAL`\n* `GIROPAY`\n* `PAYDIREKT`\n* `KLARNA`\n* `GOOGLEPAY`\n* `PSD2`\n"
            example: CREDITCARD
            enum:
            - CREDITCARD
            - DIRECTDEBIT
            - REQUEST_TO_PAY
            - SOFORTUEBERWEISUNG
            - PAYPAL
            - GIROPAY
            - PAYDIREKT
            - KLARNA
            - GOOGLEPAY
            - PSD2
      description: Contains required and optional data for each payment method that should be offered.
    RiskCheckTravelInformation:
      type: object
      properties:
        actual_final_destination:
          maxLength: 3
          minLength: 0
          type: string
          description: 'IATA Code for the actual final destination that the customer intends to travel to.

            It should be a destination on the complete_route.'
          example: SFO
        complete_route:
          maxLength: 255
          minLength: 0
          type: string
          description: Concatenation of individual travel legs in the format ORIG1-DEST1[:ORIG2-DEST2...:ORIGn-DESTn]
          example: SFO-JFK:JFK-LHR:LHR-CDG
        departure_time:
          type: string
          description: Departure date and time of the first leg of the trip.
          format: date-time
        journey_type:
          type: string
          description: "Type of travel, for example one way or round trip.\n                \n* `ONEWAY`\n* `ROUNDTRIP`\n"
          example: ONEWAY
          enum:
          - ONEWAY
          - ROUNDTRIP
        legs:
          maxItems: 60
          minItems: 0
          type: array
          description: Single legs of the complete journey.
          items:
            $ref: '#/components/schemas/RiskmanagementTravelInformationLeg'
        number_of_passengers:
          type: string
          description: Number of passengers for whom the ticket was issued.
          example: '1'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/RiskmanagementTravelInformationPassenger'
      description: Travel information of the order.
    Basket:
      type: object
      properties:
        basket_id:
          maxLength: 140
          minLength: 0
          type: string
          description: 'Dependent on the backend services the value might be shortened or special characters might be removed before sending.


            giropay: Will be displayed by giropay at the first row of the remittance information on the giropay form. Values longer than 27 characters will be cut off.'
          example: basket123456
        invoice_id:
          maxLength: 127
          minLength: 0
          type: string
          description: The API caller-provided external invoice number for this order.
          example: RE123345
        soft_descriptor:
          type: string
          description: Dynamic text used to construct the statement descriptor that appears on a payer's card statement.
          example: 800-123-1234
        shipping_costs:
          $ref: '#/components/schemas/AmountCurrency'
        basket_discount:
          $ref: '#/components/schemas/AmountCurrency'
        basket_type:
          type: string
          description: 'Type of a shopping basket. Mandatory for PayPal.


            * `DIGITAL`: Basket contains digital items only.

            * `MIXED`: Basket contains items of various types.

            * `PHYSICAL`: Basket contains physical items only.

            '
          example: DIGITAL
          enum:
          - DIGITAL
          - MIXED
          - PHYSICAL
        extensions:
          $ref: '#/components/schemas/BasketExtensions'
        basket_items:
          type: array
          description: An array of items that the customer purchases from the merchant.
          items:
            $ref: '#/components/schemas/BasketItem'
      description: A generalized shopping basket.
    CustomerExtensionPayPalData:
      type: object
      properties:
        payer_id:
          maxLength: 13
          minLength: 0
          type: string
          example: 23456789ABCDE
        tax_info:
          $ref: '#/components/schemas/TaxInfo'
      description: PayPal specific customer information fields.
    AccountInformation:
      type: object
      properties:
        account_change_date:
          type: string
          description: Date of the last change to the client's account. This includes changes to the billing or shipping addresses, new payment methods or new users added.
          format: date
          example: '2021-10-25'
        account_creation_indicator:
          type: string
          description: 'What kind of account is it?


            * GUEST

            * NEW_ACCOUNT

            * EXISTING_ACCOUNT

            '
          example: GUEST
          enum:
          - GUEST
          - NEW_ACCOUNT
          - EXISTING_ACCOUNT
        account_id:
          type: string
          description: The account ID.
          example: MC_ACC_12345678
        account_opened_date:
          type: string
          description: Date the client opened the account. This usually only applies if this is an EXISTING_ACCOUNT.
          format: date
          example: '2021-10-25'
        modification_indicator:
          type: string
          description: 'This field is applicable only if this is an EXISTING_ACCOUNT.


            * ACCOUNT_UPDATED_NOW

            * ACCOUNT_UPDATED_PAST

            '
          example: ACCOUNT_UPDATED_NOW
          enum:
          - ACCOUNT_UPDATED_NOW
          - ACCOUNT_UPDATED_PAST
        password_change_date:
          type: string
          description: Date the client last changed the account's password. May be empty if the password has not been changed yet.
          format: date
          example: '2021-10-25'
        password_change_indicator:
          type: string
          description: 'This field is applicable only if this is an EXISTING_ACCOUNT.


            * PASSWORD_CHANGED_NOW

            * PASSWORD_CHANGED_PAST

            * PASSWORD_NEVER_CHANGED

            '
          example: PASSWORD_CHANGED_NOW
          enum:
          - PASSWORD_CHANGED_NOW
          - PASSWORD_CHANGED_PAST
          - PASSWORD_NEVER_CHANGED
        payment_account_date:
          type: string
          description: Only applicable if PAYMENT_ACCOUNT_EXISTS.
          format: date
          example: '2021-10-25'
        payment_account_history:
          type: string
          description: 'This field is applicable only if this is a NEW_ACCOUNT or EXISTING_ACCOUNT.


            * PAYMENT_ACCOUNT_EXISTS

            * PAYMENT_ACCOUNT_ADDED_NOW

            '
          example: PAYMENT_ACCOUNT_EXISTS
          enum:
          - PAYMENT_ACCOUNT_EXISTS
          - PAYMENT_ACCOUNT_ADDED_NOW
        add_card_attempts:
          maximum: 999
          type: integer
          description: Number of add card attempts during the last 24 hours.
          format: int32
          example: 1
        provisioning_day_count:
          maximum: 9999
          type: integer
          description: The provisioning day counter.
          format: int32
          example: 1
        purchases_six_month_count:
          maximum: 9999
          type: integer
          description: Number of purchases with this account during the previous six months.
          format: int32
          example: 2
        shipping_address_first_use_date:
          type: string
          description: Date when the shipping address was first used for this transaction. Only applies if firstUseOfShippingAddress is false and this is not a guest account.
          format: date
          example: '2021-10-25'
        shipping_address_first_use:
          type: boolean
          description: Applicable if this is not a guest account.
          example: false
        shipping_name_indicator:
          type: string
          description: The shipping name indicator. Indicates if the account's cardholder name equals the shipping name used for this transaction.
          example: '02'
        suspicious_account_activity:
          type: boolean
          description: Indicates whether the merchant experienced suspicious activity (including previous fraud) on the account.
          example: false
        transactions_day_count:
          maximum: 999
          type: integer
          description: Number of transactions (successful or abandoned) of this account during the last 24 hours.
          format: int32
          example: 1
        transactions_year_count:
          maximum: 9999
          type: integer
          description: Number of transactions (successful or abandoned) of this account during the last 365 days.
          format: int32
          example: 1
      description: Information on a user's account usage, payment history, transaction statistics.
    FormPSD2PaymentData:
      type: object
      properties:
        iban:
          maxLength: 22
          minLength: 22
          pattern: DE[0-9]{20}
          type: string
          description: The international bank account number of a German bank account.
          example: DE17215730140403340300
        due_date:
          type: string
          description: 'Due date of the credit transfer. Full-date notation as defined by

            RFC 3339, section 5.6. If you leave this field empty the credit transfer is carried

            out as soon as possible.'
          format: date
        alias_action:
          $ref: '#/components/schemas/AliasAction'
        processing_options:
          type: array
          items:
            type: string
            description: "Defines an additional processing option for credit transfers. One of\n\n * `INSTANT`: Process as instant payment.\n * `INSTANT_IF_POSSIBLE`: Process as instant payment if possible.\n"
            enum:
            - INSTANT
            - INSTANT_IF_POSSIBLE
      description: Data to initialize a PSD2 payment form service interaction.
    MandateResponse:
      required:
      - signed_on
      type: object
      properties:
        mandate_id:
          maxLength: 32
          minLength: 32
          type: string
          description: Unique identification of the SEPA mandate. Use it for managed and already created mandates.
          example: 89c3d6b532be80339839f1605201f2c7
        signed_on:
          type: string
          description: Date when the SEPA mandate was issued. Full-date notation as defined by RFC 3339, section 5.6.
          format: date
          example: '2017-01-01'
    WeChatPayResponse:
      required:
      - message
      - rc
      type: object
      properties:
        rc:
          type: string
          description: Response code of the transaction. "0" in the case of a successful transaction. Other values signify errors.
          example: '0'
        message:
          type: string
          description: Success or error message, text for the response code.
          example: Transaction approved.
        redirect_url:
          maxLength: 1024
          minLength: 0
          type: string
          description: URL to redirect the customer to.
          example: https://staging.pushpayments.db.com/pay/eyJwYXlsb2FkIjp7InYiOjEsImlwaS
        tx_id:
          type: string
          description: Unique transaction identifier. Can be used to reference this transaction.
          example: 020LMG10jxSI8FN0OC4vLR
        payment_purpose:
          type: string
          description: Reflects what the consumer will see on the proof of payment.
          example: 47X6G4V
        settlement_amount:
          type: string
          description: The amount in the settlement currency of the transaction. The amount is calculated by WeChatPay. In minor units according to ISO 4217.
          example: '160'
        settlement_currency:
          type: string
          description: The settlement currency of the transaction.
          example: USD
        cny_amount:
          type: string
          description: The amount deducted from the consumer’s wallet. In CNY major units.
          example: '7.84'
        expiry_timestamp:
          type: string
          description: The expiry time of the transaction.
          example: '1574869035'
        fix_rate:
          type: string
          description: This exchange rate is guaranteed for potential refunds.
          example: '6.44145'
        qr_code_url:
          type: string
          description: The string used for generating the payment QR code image.
        src_amount:
          type: string
          description: The total amount debited from the consumer's WeChat Wallet.
          example: '784'
        src_currency:
          type: string
          description: The currency of the consumer's WeChat wallet.
          example: CNY
    MerchantInformation:
      type: object
      properties:
        locale:
          type: string
          description: Language of the form to be displayed according to ISO 639-1.
          example: en
        merchant_data_1:
          type: string
          description: The first merchant data field.
          example: '123456789'
        merchant_data_2:
          type: string
          description: The second merchant data field.
          example: '123456789'
        merchant_data_3:
          type: string
          description: The third merchant data field.
          example: '123456789'
        extensions:
          $ref: '#/components/schemas/MerchantInformationExtensions'
    FormPSD2ReversalResponse:
      required:
      - message
      - outcome
      - rc
      type: object
      properties:
        rc:
          type: string
          description: Response code of the transaction. "0" in the case of a successful transaction. Other values signify errors.
          example: '0'
        message:
          type: string
          description: Success or error message, text for the response code.
          example: Transaction approved.
        redirect_url:
          maxLength: 1024
          minLength: 0
          type: string
          description: URL to redirect the customer to.
          example: https://staging.pushpayments.db.com/pay/eyJwYXlsb2FkIjp7InYiOjEsImlwaS
        tx_id:
          type: string
          description: Unique transaction identifier. Can be used to reference this transaction.
          example: 020LMG10jxSI8FN0OC4vLR
        outcome:
          type: string
          description: "Indicates the outcome of the PSD2 reversal transaction.\n        \n* `PROCESSED`: The reversal has been processed, no further action is required.\n        Consult attribute `processed` for details of the processed transaction.\n* `REDIRECT_REQUIRED`: The customer has to authorize the reversal.\n"
          enum:
          - PROCESSED
          - REDIRECT_REQUIRED
        processed:
          $ref: '#/components/schemas/PaymentResponse'
    FormThemeProperty:
      required:
      - selector
      - value
      type: object
      properties:
        selector:
          type: string
          description: "For a number of elements custom CSS attributes can be applied.\n        \nProperties ending with `ZINDEX`, `BOX_SHADOW`,  `FONT_FAMILY`, `LETTER_SPACING` or `COLOR` refer\nto the following CSS attributes:\n\n\n* https://www.w3schools.com/cssref/pr_pos_z-index.asp[`z-index`] Example: `4321`\n* https://www.w3.org/TR/css-backgrounds-3/#box-shadow[`box-shadow`] Example: `0rem 0.375rem 1.5rem 0rem rgba(16,32,64,0.8)`\n* https://www.w3.org/TR/css-fonts-3/#font-family-desc[`font-family`] Example: `IBM Plex Sans`\n* https://www.w3.org/TR/CSS22/text.html#spacing-props[`letter-spacing`] Example: `0.027rem`\n* https://www.w3.org/TR/css-color-3/#rgb-color[`color`] Example: `srgb(192,32,32)`\n\nName of the theme properties:\n\n\n* `PREDEFINED`: the main theming. Available options are `dark` or `bright`\n* `GLOBAL_ZINDEX`: Global z-index. This z-index has to be higher than any z-index that may occur on page.\n* `POPUP_BOX_SHADOW`: Box shadow for whole popup.\n* `GLOBAL_FONT_FAMILY`: The one and only font family to use for any text in popup.\n* `GLOBAL_LETTER_SPACING`: Letter spacing for regular text.\n* `GLOBAL_FINEPRINT_LETTER_SPACING`: Letter spacing for fine print like caption above input fields.\n* `GLOBAL_INTERACTIVE_COLOR` Interactive color for elements like buttons or links.\n* `GLOBAL_INTERACTIVE_HOVER_COLOR` Color to use for hovering above interactive elements.\n* `MODAL_BACKGROUND_COLOR` Background color for modal element that covers everything below the popup.\n* `CARD_BACKGROUND_COLOR` Background color for main card.\n* `CARD_COLOR` Text color for main card. In css notation.\n* `HEADER_BACKGROUND_COLOR` Background color for header.\n* `FOOTER_BACKGROUND_COLOR` Background color for footer. Important for mobile view.\n* `BUTTON_SECONDARY_BACKGROUND_COLOR` Secondary colors may have a special background color instead of being transparent.\n* `BUTTON_PRIMARY_COLOR` Text color for primary buttons.\n* `INPUT_BACKGROUND_COLOR` Background color for input fields.\n* `INPUT_CAPTION_COLOR` Text color of captions above input fields.\n* `INPUT_PLACEHOLDER_COLOR` Text color for placeholders inside input fields.\n* `INPUT_BORDER_COLOR` The border color around input fields.\n* `INPUT_TEXT_COLOR` The text color for user entered values.\n\n"
          enum:
          - PREDEFINED
          - GLOBAL_ZINDEX
          - POPUP_BOX_SHADOW
          - GLOBAL_FONT_FAMILY
          - GLOBAL_LETTER_SPACING
          - GLOBAL_FINEPRINT_LETTER_SPACING
          - GLOBAL_INTERACTIVE_COLOR
          - GLOBAL_INTERACTIVE_HOVER_COLOR
          - MODAL_BACKGROUND_COLOR
          - CARD_BACKGROUND_COLOR
          - CARD_COLOR
          - HEADER_BACKGROUND_COLOR
          - FOOTER_BACKGROUND_COLOR
          - BUTTON_SECONDARY_BACKGROUND_COLOR
          - BUTTON_PRIMARY_COLOR
          - INPUT_BACKGROUND_COLOR
          - INPUT_CAPTION_COLOR
          - INPUT_PLACEHOLDER_COLOR
          - INPUT_BORDER_COLOR
          - INPUT_TEXT_COLOR
        value:
          type: string
          description: The property value.
      description: Custom theme property to be displayed in the form instead of the standard presentation.
    TransactionInfo:
      type: object
      properties:
        type:
          type: string
