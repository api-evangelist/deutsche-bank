components:
  schemas:
    ExpiryDate:
      required:
      - month
      - year
      type: object
      properties:
        year:
          maximum: 2099
          minimum: 2000
          type: integer
          description: The credit card expiry year.
          format: int32
          example: 2021
        month:
          maximum: 12
          minimum: 1
          type: integer
          description: The credit card expiry month.
          format: int32
          example: 11
      description: The credit card expiry date.
    Callback:
      type: object
      properties:
        notify_url:
          maxLength: 500
          minLength: 1
          type: string
          description: URL for the shop notification.
          example: https://www.example.com/notify/e1234123489
        additional_data:
          maxLength: 255
          minLength: 0
          type: string
          description: Freely allocatable field. Will be returned in the shop notification.
          example: SESSION_1234X
        skip:
          type: boolean
          description: If true the shop notification is skipped.
          default: false
      description: Data for the shop notification.
    FormCustomerContinuation:
      required:
      - success_url
      type: object
      properties:
        redirect:
          type: boolean
          description: "If `true` the customer will be redirected directly. If `false` a page with a link \"back to the shop\" is shown to the customer. \nFor paydirekt and PayPal the customer will always be redirected directly to the shop."
          example: true
        success_url:
          type: string
          description: URL the customer should be redirected to after a successful form service payment.
          example: https://www.example.com/success
        error_url:
          type: string
          description: URL the customer should be redirected to after a failed form service payment.
          example: https://www.example.com/error
        notification_failed_url:
          type: string
          description: URL the customer should be redirected to after a successful form service transaction for which the notification of your application failed.
          example: https://www.example.com/notificationFailed
      description: Includes data for redirecting a customer after a form service payment.
    CommonAddress:
      type: object
      properties:
        title:
          type: string
          description: Customer's title.
          example: Ms
        first_name:
          maxLength: 60
          minLength: 0
          type: string
          description: First name of the individual.
          example: Jane
        last_name:
          maxLength: 60
          minLength: 0
          type: string
          description: Last name of the individual.
          example: Doe
        company_name:
          maxLength: 60
          minLength: 0
          type: string
          description: Name of the company.
          example: Acme Inc.
        email:
          maxLength: 255
          minLength: 0
          type: string
          description: Email address of the individual.
          example: test_jane@gmail.com
        phone_contact:
          $ref: '#/components/schemas/PhoneContact'
        address_line_1:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line.
          example: Main Street 123
        address_line_2:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line. For 3DS this maps to additional1.
          example: Building A
        address_line_3:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line. For 3DS this maps to additional2.
          example: Apartment 12
        postal_code:
          maxLength: 60
          minLength: 0
          type: string
          description: Postal code of the address.
          example: '80469'
        city:
          maxLength: 60
          minLength: 0
          type: string
          description: City of the address.
          example: Munich
        state:
          maxLength: 300
          minLength: 0
          type: string
          description: State or province of the address.
          example: BY
        country:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: The ISO 3166 Alpha-2 country code (upper case) of the individual's homeland.
          example: DE
        extensions:
          $ref: '#/components/schemas/CommonAddressExtensions'
      description: Address data as applicable to most use cases.
    ErrorModel:
      required:
      - message
      - rc
      type: object
      properties:
        rc:
          type: string
          description: Four digit response code.
          example: '4001'
        message:
          type: string
          description: Describes the error.
          example: unexpected error
      description: Includes data returned in case of an error.
    TDSInfo:
      type: object
      properties:
        tds_auth_level:
          type: string
          description: "The 3D-Secure transaction status.\n        \n* `FULL`: Full 3-D Secure Authentification\n* `ATTEMPT`: 3-D Secure Authentification attempted\n"
          example: ATTEMPT
          enum:
          - FULL
          - ATTEMPT
        tds_version:
          maxLength: 10
          minLength: 0
          type: string
          description: 3-D Secure version.
        tds_ares_cardholder_info:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes card holder information.'
        tds_ares_error_code:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error code.'
        tds_ares_error_component:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error component.'
        tds_ares_trans_status:
          maxLength: 1
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes transaction status.'
          example: Y
        tds_ares_trans_status_reason:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: reason for the ARes transaction status.'
          example: MediumConfidence
        tds_rreq_challenge_cancel_indicator:
          maxLength: 80
          minLength: 0
          type: string
          description: Optional 3-D Secure 2 response parameter.
          example: CardholderCancel
        tds_rreq_error_code:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error code.'
        tds_rreq_error_component:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error component.'
        tds_rreq_trans_status:
          maxLength: 1
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq transaction status.'
        tds_rreq_trans_status_reason:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: reason for the RReq transaction status.'
          example: MediumConfidence
        tds_ares_error_description:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error description.'
