          - CREDITCARD
          - CREDITCARD_3DS20
          - CREDITTRANSFER
          - SOFORTUEBERWEISUNG
          - PAYPAL
          - PAYDIREKT
          - WECHATPAY
          - P24
          - GIROPAY
          - KLARNA
          - PSD2
        tx_action:
          type: string
          description: The action of a transaction.
          enum:
          - authorization
          - capture
          - credit
          - preauthorization
          - refund
          - reversal
          - risk_check
          - verify-mop
          - payment
          - avs
          - avspayment
        alias_info:
          $ref: '#/components/schemas/AliasInfo'
        back_rc:
          maxLength: 255
          minLength: 0
