openapi: 3.2.0
info:
  title: Merchant-Server II REST Services Payment API
  version: v2.1
  description: The Payment API contains endpoints to add or modify payment transactions. When using the API, the merchant is only integrated to the API at the backend. All use cases are triggered via an API call. It is the merchant's responsibility to collect all relevant payment data via their own frontend.
servers:
- url: https://testmerch.directpos.de/rest-api/services/v2.1/
security:
- bearerAuth: []
tags:
- name: Payment
  description: The Payment API contains endpoints to add or modify payment transactions. When using the API, the merchant is only integrated to the API at the backend. All use cases are triggered via an API call. It is the merchant's responsibility to collect all relevant payment data via their own frontend.
paths:
  /payment/event/{event_id}/creditcard/{tx_action}:
    post:
      tags:
      - Payment
      summary: Creates an initial creditcard payment transaction (authorization…
      operationId: paymentCreditCardPost
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: event_id
        in: path
        description: A unique ID for the event.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
      - name: tx_action
        in: path
        description: The action of an initial transaction.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - authorization
          - preauthorization
          - credit
          - verify-mop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreditCardRequestInitial'
            example:
              amount_total:
                amount: 100
                currency: EUR
              means_of_payment:
                credit_card:
                  number: '4111111111111111'
                  expiry_date:
                    year: 2027
                    month: 12
                  code: '111'
                  card_holder: Rene Meier
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: Information about the payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /payment/event/{event_id}/directdebit/{tx_action}:
    post:
      tags:
      - Payment
      summary: Creates an initial SDD payment transaction (pre-authorization, authorization…
      operationId: paymentDirectDebitPost
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: event_id
        in: path
        description: A unique ID for the event.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
      - name: tx_action
        in: path
        description: The action of an initial transaction.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - authorization
          - preauthorization
          - credit
          - verify-mop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDirectDebitRequestInitial'
            example:
              amount_total:
                amount: 100
                currency: EUR
              means_of_payment:
                bank_account:
                  account_holder: Rene Meier
                  iban: DE39123456790009290701
              mandate:
                reference: MDT1620213727383XY
                mandate_name: Sample mandate name
                signed_on: '2020-12-30'
                mandate_sequence_type: ONEOFF
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: The request has been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /payment/event/{event_id}:
    get:
      tags:
      - Payment
      summary: Retrieves details of an event (consisting of one or more transactions)
      operationId: paymentEventGet
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: event_id
        in: path
        description: A unique ID for the event.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: The request has been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDiagnosisEventResponse'
  /payment/event/{event_id}/klarna/{tx_action}:
    post:
      tags:
      - Payment
      summary: Creates an initial Klarna payment transaction (pre-authorization, authorization)
      operationId: paymentKlarnaPost
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: event_id
        in: path
        description: A unique ID for the event.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
      - name: tx_action
        in: path
        description: The action of an initial transaction.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - authorization
          - preauthorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentKlarnaRequestInitial'
            example:
              customer_information:
                date_of_birth: '1980-01-01'
              shipping_address:
                title: Ms
                first_name: Jane
                last_name: Doe
                email: test_jane@gmail.com
                address_line_1: Main Street 123
                address_line_2: Building A
                address_line_3: Apartment 12
                postal_code: '80469'
                phone_contact:
                  phone_type: MOBILE
                  phone_number: '+4917614287464'
                city: Munich
                country: DE
                extensions: {}
              billing_address:
                title: Ms
                first_name: Jane
                last_name: Doe
                email: test_jane@gmail.com
                address_line_1: Main Street 123
                address_line_2: Building A
                address_line_3: Apartment 12
                postal_code: '80469'
                phone_contact:
                  phone_type: MOBILE
                  phone_number: '+4917614287464'
                city: Munich
                country: DE
                extensions:
                  klarna_data:
                    custom_payment_method_ids: []
              basket:
                basket_id: basket123456
                invoice_id: RE123345
                soft_descriptor: 800-123-1234
                shipping_costs:
                  amount: 200
                  currency: EUR
                basket_type: DIGITAL
                extensions:
                  paypal_data:
                    custom_id: CUSTOMID123
                basket_items:
                - name: A fine shirt
                  description: BI123456
                  reference: UGG-BB-PUR-06
                  quantity:
                    quantity_amount: 5
                    quantity_unit: pcs
                  unit_price:
                    net: 100
                    gross: 100
                    currency: EUR
                    tax: 1900
                  discount:
                    net: 0
                    gross: 0
                    currency: EUR
                    tax: 1900
                  extensions:
                    klarna_data:
                      klarna_type: PHYSICAL
                      image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Camisade_pu%C3%B1o_doble.jpg/256px-Camisade_pu%C3%B1o_doble.jpg
              form_data:
                locale: en
              amount_total:
                amount: 700
                currency: EUR
              merchant_information:
                merchant_data_1: merchantData1
                merchant_data_2: merchantData2
                merchant_data_3: merchantData3
              means_of_payment:
                alias: AliAss
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: The request has been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /payment/event/{event_id}/tx/{tx_id}/{tx_action}:
    post:
      tags:
      - Payment
      summary: Creates a subsequent transaction (capture, reversal, or refund) referencing a…
      operationId: paymentTxActionPost
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: event_id
        in: path
        description: A unique ID for the event. Use the same value as in the predecessor transaction the current transaction relates to.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
      - name: tx_id
        in: path
        description: A reference to a transaction retrieved in a response (tx_reference_id).
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[/0-9a-zA-Z=_-]+'
          type: string
        example: 020LMG10jxSI8FN0OC4vLR
      - name: tx_action
        in: path
        description: The action of a subsequent transaction.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - capture
          - reversal
          - refund
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestSubsequent'
            examples:
              sample21:
                summary: Sample credit card subsequent transaction
                description: Sample credit card subsequent transaction
                value:
                  kind: CREDITCARD
                  basket:
                    basket_id: basket123456
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: The request has been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /payment/tx/{tx_id}:
    get:
      tags:
      - Payment
      summary: Retrieves details of a (single) transaction
      operationId: paymentTxGet
      parameters:
      - name: Merchant-ID
        in: header
        description: Unique identification of the merchant for whom the transaction is carried out. This parameter is  required if the `Merchant-ID` cannot be derived from the `client_id` you used for authentication.
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 10
          minLength: 10
          pattern: '[0-9]+'
          type: string
      - name: tx_id
        in: path
        description: A reference to a transaction retrieved in a response (tx_reference_id).
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 50
          minLength: 1
          pattern: '[/0-9a-zA-Z=_-]+'
          type: string
        example: 020LMG10jxSI8FN0OC4vLR
      responses:
        '400':
          description: Response in case of an error. Includes a response code and an error message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '401':
          description: Unauthorized request. Response body may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '200':
          description: The request has been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
components:
  schemas:
    AliasInfo:
      type: object
      properties:
        alias:
          type: string
          description: Name of the alias.
          example: da2c9029-b180-42a7-b473-50d182a01f8a
        credit_card:
          $ref: '#/components/schemas/CreditCardInfo'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        address:
          $ref: '#/components/schemas/CommonAddress'
      description: Contains information about the created or updated alias. This field is null if the there was no 'alias_info' in the request.
    ExpiryDate:
      required:
      - month
      - year
      type: object
      properties:
        year:
          maximum: 2099
          minimum: 2000
          type: integer
          description: The credit card expiry year.
          format: int32
          example: 2021
        month:
          maximum: 12
          minimum: 1
          type: integer
          description: The credit card expiry month.
          format: int32
          example: 11
      description: The credit card expiry date.
    CommonAddressExtensions:
      type: object
      properties:
        alternative_address_data:
          $ref: '#/components/schemas/AlternativeAddressData'
        paydirekt_data:
          $ref: '#/components/schemas/AddressPaydirektData'
      description: Service specific address fields.
    BankAccount:
      required:
      - iban
      type: object
      properties:
        bic:
          maxLength: 11
          minLength: 11
          pattern: '[A-Z]{6}[A-Z2-9][A-NP-Z0-9][A-Z0-9]{3}'
          type: string
          description: "The business identifier code (BIC) of a bank account. If the branch identifier\n                (positions 9 to 11) is not applicable, it is set to \"XXX\". "
          example: VZVDDED1XXX
        iban:
          maxLength: 34
          minLength: 15
          pattern: '[A-Z]{2}[0-9]{2}[A-Z0-9*]{11,30}'
          type: string
          description: The international bank account number of a bank account.
          example: DE17215730140403340300
        account_holder:
          maxLength: 27
          minLength: 1
          pattern: .*
          type: string
          description: The account holder of the bank account.
          example: Max Muster
        bank_name:
          type: string
          description: Name of the bank.
          example: Musterbank
      description: Information about a bank account.
    PaymentDiagnosisEventResponse:
      required:
      - message
      - rc
      type: object
      properties:
        rc:
          type: string
          description: Response code of the transaction. "0" in the case of a successful transaction. Other values signify errors.
          example: '0'
        message:
          type: string
          description: Success or error message, text for the response code.
          example: Transaction approved.
        transactions:
          type: array
          description: All transactions that are assigned to this event.
          items:
            $ref: '#/components/schemas/PaymentDiagnosisResponse'
        payment_link_info:
          $ref: '#/components/schemas/PaymentLinkInfo'
      description: Response contains all transactions belonging to the event.
    TaxInfo:
      required:
      - tax_id
      - tax_id_type
      type: object
      properties:
        tax_id:
          type: string
          description: The customer's tax ID value.
          example: 867.226.847-41
        tax_id_type:
          type: string
          description: 'Type of tax ID. May be country specific. Different types may adhere to different patterns.


            * `BR_CPF` : Brazilian individual tax id type.

            * `BR_CNPJ` : Brazilian business tax id type.

            * `OTHER` : None of the above.

            '
          example: BR_CPF
          enum:
          - BR_CPF
          - BR_CNPJ
          - OTHER
      description: Legal tax information of the payer.
    PaymentRequestSubsequent:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          description: The type of transaction.
          enum:
          - DIRECTDEBIT
          - CREDITCARD
          - CREDITCARD_3DS20
          - CREDITTRANSFER
          - SOFORTUEBERWEISUNG
          - PAYPAL
          - PAYDIREKT
          - WECHATPAY
          - P24
          - GIROPAY
          - KLARNA
          - PSD2
        changed_amount:
          type: integer
          description: The changed transaction amount for follow-up transactions.
          format: int64
          example: 200
        due_date:
          type: string
          description: 'Optional in the case of a direct debit capture. Due date of a direct debit payment. Full-date notation as defined by

            RFC 3339, section 5.6. The due date has to be at least three TARGET2 business days (not on weekends or the so

            called TARGET2 or TARGET holidays) after the current date. If you leave this field empty the direct debit is carried

            out as soon as possible.'
          format: date
        description:
          type: string
          description: The description of the transaction.
          example: The description of the transaction.
        basket:
          $ref: '#/components/schemas/Basket'
        shipping_info:
          $ref: '#/components/schemas/ShippingInfo'
    MeansOfPaymentKlarna:
      required:
      - alias
      type: object
      properties:
        alias:
          type: string
          description: A previously registered alias.
          example: 221f56ca355d8e6c42517749cf79ceb8
      description: The means of payment that will be used. Exactly one of the given means is valid.
    BasketItem:
      type: object
      properties:
        name:
          maxLength: 127
          minLength: 0
          type: string
          description: Descriptive name of the order item. Mandatory for PayPal.
          example: A fine shirt
        description:
          maxLength: 127
          minLength: 0
          type: string
          description: Used for storing merchant's internal order number or other reference.
          example: BI123456
        reference:
          maxLength: 64
          minLength: 0
          type: string
          description: Article number, SKU or similar.
          example: UGG-BB-PUR-06
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit_price:
          $ref: '#/components/schemas/TaxedAmountCurrency'
        item_discount:
          $ref: '#/components/schemas/TaxedAmountCurrency'
        extensions:
          $ref: '#/components/schemas/BasketItemExtensions'
      description: A purchasable item that is part of a shopping basket's list of items.
    RiskmanagementInfoResponse:
      type: object
      properties:
        case_priority:
          type: string
          description: Riskcheck information regarding the case priority.
          example: '1'
        error_information:
          $ref: '#/components/schemas/RiskmanErrorInformation'
        event_id:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
          description: A unique ID for the event.
          example: E5686585867636541231230
        infocodes_address:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the address risk check. See user guide for details and all possible values.
            example: '["COR-BA","COR-SA","MM-A","MM-Z"]'
        infocodes_customerlist:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the customer list risk check.  See user guide for details and all possible values.
            example: '["CONPOSNEG","NEG-BCO"]'
        infocodes_device_behaviour:
          type: array
          items:
            type: string
            description: Indicates the device behavior information code(s) returned from device fingerprinting. See user guide for details and all possible values.
            example: '["MouseOffPageDetected"]'
        infocodes_globalvelocity:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the velocity risk check. See user guide for details and all possible values.
            example: '["VEL-ADDR","VELS-FP"]'
        infocodes_identitychange:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the identity change. See user guide for details and all possible values.
            example: '["ID-M-HPOS"]'
        infocodes_internet:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the internet check. See user guide for details and all possible values.
            example: '["FREE-EM"]'
        infocodes_phone:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the phone risk check. See user guide for details and all possible values.
            example: '["MMACBST, "UNV-PH" ]'
        infocodes_suspicious:
          type: array
          items:
            type: string
            description: Riskcheck information regarding suspicious risk. See user guide for details and all possible values.
            example: '["BAD-FP","MUL-EM"]'
        infocodes_velocity:
          type: array
          items:
            type: string
            description: 'List of information codes triggered by the order. These information codes were generated when you created

              the order and product velocity rules and are returned so that you can associate them with the rules. See user guide for details and all possible values.'
            example: '["GVEL-R20","GVEL-R21"]'
        localtime:
          type: string
          description: Riskcheck information regarding the local time of the risk check.
          example: '55083'
        profile_destination_queue:
          type: string
          description: Riskcheck information regarding the profile destination queue of the risk check.
          example: dst-queue
        profile_name:
          type: string
          description: Riskcheck information regarding the profile of the risk check.
          example: example-profile
        profile_selectorrule:
          type: string
          description: Riskcheck information regarding the profile selector rule risk check.
          example: example-rule
        providers:
          type: array
          items:
            type: string
            description: Providers used to calculate the risk.
            example: '["provider1","provider2"]'
        rules:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the matched rules in risk check.
            example: '["example-rule"]'
        score:
          type: string
          description: Calculated risk score of request data.
          example: '14'
        score_factor_codes:
          type: array
          items:
            type: string
            description: Riskcheck information regarding the profile factor codes of the risk check. See user guide for all possible values.
            example: '["G","H","Y","Z"]'
        score_model_used:
          type: string
          description: Name of the score model used for the transaction. This field contains the name of risk management’s selected model.
          example: default_eu
        travel_actual_final_dst_country:
          type: string
          description: Actual country of final destination of the travel.
          example: US
        travel_actual_final_dst_locality:
          type: string
          description: Actual city of final destination of the travel.
          example: Chicago
        travel_first_departure_country:
          type: string
          description: First departure country of the travel.
          example: US
        travel_first_departure_locality:
          type: string
          description: First departure city of the travel.
          example: San Francisco
        tx_risk_status:
          type: string
          description: Status result of an external risk management transaction. See user guide for all possible values.
          example: ACCEPTED
        tx_scoring_id:
          type: string
          description: Unique scoring transaction identifier. Can be used to reference the depending scoring transaction.
          example: '6373172383866963604006'
        utc_time:
          type: string
          description: Riskcheck information regarding the UTC time of the risk check, used in error cases.
          example: '2021-12-21T14:18:04Z'
    CreditCardInfo:
      required:
      - expiry_date
      - number
      type: object
      properties:
        number:
          maxLength: 19
          minLength: 10
          pattern: '[0-9]*'
          type: string
          description: The credit card number (Primary Account Number). It is sometimes masked in response messages, for example 411111******1111.
          example: '41111111111111111'
        expiry_date:
          $ref: '#/components/schemas/ExpiryDate'
        cardholder:
          maxLength: 27
          minLength: 1
          type: string
          description: The holder of a credit card.
          example: Max Muster
        brand:
          type: string
          description: "The credit card brand.  The use of this field requires an explicit activation. Please contact customer support. Possible values:     \n           \n* `AMEX`\n* `DINERS`\n* `JCB`\n* `MAESTRO`\n* `MASTERCARD`\n* `VISA`        \n"
          example: VISA
          enum:
          - AMEX
          - DINERS
          - JCB
          - MAESTRO
          - MASTERCARD
          - VISA
        issuer_country:
          type: string
          description: The card issuers country of origin.  The use of this field requires an explicit activation. Please contact customer support.
      description: Information about a credit card.
    PhoneContact:
      required:
      - phone_number
      - phone_type
      type: object
      properties:
        phone_type:
          type: string
          description: 'The phone type.


            * `FAX`

            * `HOME`

            * `MOBILE`

            * `OTHER`

            * `PAGER`

            * `WORK`

            '
          example: FAX
          enum:
          - FAX
          - HOME
          - MOBILE
          - OTHER
          - PAGER
          - WORK
        phone_number:
          maxLength: 16
          minLength: 0
          pattern: \+[1-9]\d{1,14}
          type: string
          description: A phone number in its canonical international E.164 numbering plan format.
          example: '+442071838750'
      description: A means of contacting a customer by phone.
      example:
        phone_type: FAX
        phone_number: '+442071838750'
    MerchantInformationKlarnaData:
      type: object
      properties:
        custom_payment_method_ids:
          type: array
          description: List of custom payment method ids.
          example:
          - klarna_invoice
          - klarna_installments
          items:
            type: string
            description: List of custom payment method ids.
            example: '["klarna_invoice","klarna_installments"]'
      description: Klarna specific MerchantInformation fields.
    CommonAddress:
      type: object
      properties:
        title:
          type: string
          description: Customer's title.
          example: Ms
        first_name:
          maxLength: 60
          minLength: 0
          type: string
          description: First name of the individual.
          example: Jane
        last_name:
          maxLength: 60
          minLength: 0
          type: string
          description: Last name of the individual.
          example: Doe
        company_name:
          maxLength: 60
          minLength: 0
          type: string
          description: Name of the company.
          example: Acme Inc.
        email:
          maxLength: 255
          minLength: 0
          type: string
          description: Email address of the individual.
          example: test_jane@gmail.com
        phone_contact:
          $ref: '#/components/schemas/PhoneContact'
        address_line_1:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line.
          example: Main Street 123
        address_line_2:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line. For 3DS this maps to additional1.
          example: Building A
        address_line_3:
          maxLength: 60
          minLength: 0
          type: string
          description: An address line. For 3DS this maps to additional2.
          example: Apartment 12
        postal_code:
          maxLength: 60
          minLength: 0
          type: string
          description: Postal code of the address.
          example: '80469'
        city:
          maxLength: 60
          minLength: 0
          type: string
          description: City of the address.
          example: Munich
        state:
          maxLength: 300
          minLength: 0
          type: string
          description: State or province of the address.
          example: BY
        country:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: The ISO 3166 Alpha-2 country code (upper case) of the individual's homeland.
          example: DE
        extensions:
          $ref: '#/components/schemas/CommonAddressExtensions'
      description: Address data as applicable to most use cases.
    RiskmanErrorFieldInformation:
      type: object
      properties:
        field:
          type: string
          description: The name of the field which was the reason of the request rejection.
          example: orderInformation.billTo.firstName
        reason:
          type: string
          description: The reason why the request was rejected.
          example: MISSING_FIELD
      description: Field name and reason why the request was rejected.
    ErrorModel:
      required:
      - message
      - rc
      type: object
      properties:
        rc:
          type: string
          description: Four digit response code.
          example: '4001'
        message:
          type: string
          description: Describes the error.
          example: unexpected error
      description: Includes data returned in case of an error.
    RiskCheckTravelInformation:
      type: object
      properties:
        actual_final_destination:
          maxLength: 3
          minLength: 0
          type: string
          description: 'IATA Code for the actual final destination that the customer intends to travel to.

            It should be a destination on the complete_route.'
          example: SFO
        complete_route:
          maxLength: 255
          minLength: 0
          type: string
          description: Concatenation of individual travel legs in the format ORIG1-DEST1[:ORIG2-DEST2...:ORIGn-DESTn]
          example: SFO-JFK:JFK-LHR:LHR-CDG
        departure_time:
          type: string
          description: Departure date and time of the first leg of the trip.
          format: date-time
        journey_type:
          type: string
          description: "Type of travel, for example one way or round trip.\n                \n* `ONEWAY`\n* `ROUNDTRIP`\n"
          example: ONEWAY
          enum:
          - ONEWAY
          - ROUNDTRIP
        legs:
          maxItems: 60
          minItems: 0
          type: array
          description: Single legs of the complete journey.
          items:
            $ref: '#/components/schemas/RiskmanagementTravelInformationLeg'
        number_of_passengers:
          type: string
          description: Number of passengers for whom the ticket was issued.
          example: '1'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/RiskmanagementTravelInformationPassenger'
      description: Travel information of the order.
    MeansOfPaymentCreditCard:
      type: object
      properties:
        token:
          maxLength: 500
          minLength: 0
          pattern: '[a-zA-Z0-9/+=_-]*'
          type: string
          description: The token value.
          example: eyJ0IjoiSFcyaS13cTB3PT0iLCJzIjoiaWIybzFRMHEifQ
        alias:
          type: string
          description: A previously registered alias.
          example: 221f56ca355d8e6c42517749cf79ceb8
        credit_card:
          $ref: '#/components/schemas/CreditCard'
      description: The means of payment that will be used. Exactly one of the given means is valid.
    TDSExternalData:
      type: object
      properties:
        tds_20_external_data:
          $ref: '#/components/schemas/TDS20ExternalData'
        tds_10_external_data:
          $ref: '#/components/schemas/TDS10ExternalData'
        tds_trans_status:
          type: string
          description: 'The 3D-Secure transaction status.


            * `Y`: Full

            * `A`: Attempt

            '
          example: A
          enum:
          - Y
          - A
        tds_version:
          type: string
          description: "The 3D-Secure version.\n\n* `V1`: Version 1 (1.0.2)\n* `V2_1`: Version 2.1.0\n* `V2_2`: Version 2.2.0\n \n"
          example: V2_1
          enum:
          - V1
          - V2_1
          - V2_2
      description: 3-D Secure data provided by an MPI/3DS Server.
    Basket:
      type: object
      properties:
        basket_id:
          maxLength: 140
          minLength: 0
          type: string
          description: 'Dependent on the backend services the value might be shortened or special characters might be removed before sending.


            giropay: Will be displayed by giropay at the first row of the remittance information on the giropay form. Values longer than 27 characters will be cut off.'
          example: basket123456
        invoice_id:
          maxLength: 127
          minLength: 0
          type: string
          description: The API caller-provided external invoice number for this order.
          example: RE123345
        soft_descriptor:
          type: string
          description: Dynamic text used to construct the statement descriptor that appears on a payer's card statement.
          example: 800-123-1234
        shipping_costs:
          $ref: '#/components/schemas/AmountCurrency'
        basket_discount:
          $ref: '#/components/schemas/AmountCurrency'
        basket_type:
          type: string
          description: 'Type of a shopping basket. Mandatory for PayPal.


            * `DIGITAL`: Basket contains digital items only.

            * `MIXED`: Basket contains items of various types.

            * `PHYSICAL`: Basket contains physical items only.

            '
          example: DIGITAL
          enum:
          - DIGITAL
          - MIXED
          - PHYSICAL
        extensions:
          $ref: '#/components/schemas/BasketExtensions'
        basket_items:
          type: array
          description: An array of items that the customer purchases from the merchant.
          items:
            $ref: '#/components/schemas/BasketItem'
      description: A generalized shopping basket.
    BasketItemKlarnaData:
      type: object
      properties:
        product_url:
          maxLength: 1024
          minLength: 0
          type: string
          description: Product's URL in the merchant's webshop. May be used in communication between Klarna and the customer.
          example: https://www.exampleobjects.com/products/123456789
        image_url:
          maxLength: 1024
          minLength: 0
          type: string
          description: Product image URL in the merchant's webshop. May be used to embed the image into communication between Klarna and the customer.
          example: https://www.exampleobjects.com/product-image-1200x1200.jpg
        product_identifiers:
          type: array
          description: Additional information identifying the basket item.
          items:
            $ref: '#/components/schemas/KlarnaProductIdentifier'
      description: Service specific basket item fields for Klarna related use cases.
    CustomerExtensionPayPalData:
      type: object
      properties:
        payer_id:
          maxLength: 13
          minLength: 0
          type: string
          example: 23456789ABCDE
        tax_info:
          $ref: '#/components/schemas/TaxInfo'
      description: PayPal specific customer information fields.
    TDSInfo:
      type: object
      properties:
        tds_auth_level:
          type: string
          description: "The 3D-Secure transaction status.\n        \n* `FULL`: Full 3-D Secure Authentification\n* `ATTEMPT`: 3-D Secure Authentification attempted\n"
          example: ATTEMPT
          enum:
          - FULL
          - ATTEMPT
        tds_version:
          maxLength: 10
          minLength: 0
          type: string
          description: 3-D Secure version.
        tds_ares_cardholder_info:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes card holder information.'
        tds_ares_error_code:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error code.'
        tds_ares_error_component:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error component.'
        tds_ares_trans_status:
          maxLength: 1
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes transaction status.'
          example: Y
        tds_ares_trans_status_reason:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: reason for the ARes transaction status.'
          example: MediumConfidence
        tds_rreq_challenge_cancel_indicator:
          maxLength: 80
          minLength: 0
          type: string
          description: Optional 3-D Secure 2 response parameter.
          example: CardholderCancel
        tds_rreq_error_code:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error code.'
        tds_rreq_error_component:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error component.'
        tds_rreq_trans_status:
          maxLength: 1
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq transaction status.'
        tds_rreq_trans_status_reason:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: reason for the RReq transaction status.'
          example: MediumConfidence
        tds_ares_error_description:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error description.'
        tds_ares_error_detail:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: ARes error detail.'
        tds_rreq_error_description:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error description.'
        tds_rreq_error_detail:
          maxLength: 80
          minLength: 0
          type: string
          description: '3-D Secure 2: RReq error detail.'
      description: Contains 3-D Secure response data.  The use of this field requires an explicit activation. Please contact customer support.
    PaymentLinkInfo:
      type: object
      properties:
        status:
          type: string
          description: "The payment link status\n\n * `LINK_INITIALIZED`: payment link is initialized\n * `LINK_DEACTIVATED`: payment link is deactivated\n * `LINK_EXPIRED`: payment link has exceeded its validity period\n * `PAYMENT_SUCCESSFUL`: payment link was used for a successful payment\n"
          example: PAYMENT_SUCCESSFUL
          enum:
          - LINK_INITIALIZED
          - LINK_DEACTIVATED
          - LINK_EXPIRED
          - PAYMENT_SUCCESSFUL
        expires:
          type: string
          description: Specifies until when the payment link is usable.
          format: date-time
      description: Contains information about the created or updated payment link.
    TransactionCreditCardInfo:
      type: object
      properties:
        credit_card:
          $ref: '#/components/schemas/CreditCardInfo'
        tds_info:
          $ref: '#/components/schemas/TDSInfo'
        recurring_payment:
          maxLength: 50
          minLength: 1
          pattern: '[/0-9a-zA-Z_.:,+*$%-]+'
          type: string
          description: Identifier of a recurring credit card payment.
          example: 07H987Tx3PF9VxL5G7RfNp
        cvc_result:
          type: string
          description: "Response code of the verification of the card verification code\n         according to the response of a backend system.  This value is available on some backend systems.  The use of this field requires an explicit activation. Please contact customer support.  \n         Possible values:\n        \n* `CVC_MATCH`\n* `CVC_NO_MATCH`\n* `CVC_NO_RESPONSE_RECEIVED`\n* `CVC_NOT_PROCESSED`\n* `CVC_NOT_PROVIDED`\n* `CVC_SHOULD_BE_ON_CARD`\n* `CVC_VERIFICATION_UNAVAILABLE`\n\n"
          example: CVC_MATCH
          enum:
          - CVC_MATCH
          - CVC_NO_MATCH
          - CVC_NO_RESPONSE_RECEIVED
          - CVC_NOT_PROCESSED
          - CVC_NOT_PROVIDED
          - CVC_SHOULD_BE_ON_CARD
          - CVC_VERIFICATION_UNAVAILABLE
        avs_result:
          type: string
          description: "Response code of the address verification according to the response of a backend system. \n         This value is available on some backend systems.  The use of this field requires an explicit activation. Please contact customer support.  Possible values:\n        \n* `MATCH`\n* `NO_MATCH`\n"
          example: MATCH
          enum:
          - MATCH
          - NO_MATCH
    KlarnaProductIdentifier:
      type: object
      properties:
        brand:
          type: string
          description: The product's brand name as generally recognized by consumers. If no brand is available for a product, do not supply any value.
          example: Intel
        category_path:
          maxLength: 750
          minLength: 0
          type: string
          description: The product's category path as used in the merchant's webshop. Include the full and most detailed category and separate the segments with '>'.
          example: Electronics Store > Computers & Tablets > Desktops
        gtin:
          pattern: '[a-zA-Z0-9]*'
          type: string
          description: The product's Global Trade Item Number (GTIN). Common types of GTIN are EAN, ISBN or UPC. Dashes and spaces must be omitted.
          example: '735858293167'
        mpn:
          type: string
          description: The product's Manufacturer Part Number (MPN), which - together with the brand - uniquely identifies a product. Only submit MPNs assigned by a manufacturer and use the most specific MPN possible.
          example: BOXNUC5CPYH
      description: Klarna specific unique identification attributes of a product.
    TaxedAmountCurrency:
      required:
      - currency
      - gross
      - net
      - tax
      type: object
      properties:
        net:
          type: integer
          description: Amount of money excl. tax in the minor currency unit.
          format: int64
          example: 100
        gross:
          type: integer
          description: Amount of money incl. tax in the minor currency unit.
          format: int64
          example: 100
        currency:
          maxLength: 3
          minLength: 3
          pattern: '[A-Z]{3}'
          type: string
          description: ISO 4217 currency code, three uppercase letters.
          example: EUR
        tax:
          maximum: 10000
          minimum: 0
          type: integer
          description: Tax percentage. Non-negative value. The percentage value is represented with two implicit decimals.
          format: int32
          example: 1900
      description: Net and gross money amount accompanied by a tax percentage and currency.
    Contacts:
      type: object
      properties:
        phone_contacts:
          type: array
          description: A means of contacting a customer by phone.
          example:
            phone_type: FAX
            phone_number: '+442071838750'
          items:
            $ref: '#/components/schemas/PhoneContact'
      description: Means of contacting the customer.
      example:
        phone_contacts:
        - phone_type: FAX
          phone_number: '+442071838750'
    ShippingInfo:
      type: object
      properties:
        shipping_company:
          type: string
          description: Name of the shipping company (as specific as possible).
          example: DHL
        shipping_method:
          type: string
          description: Shipping method.
          example: PickUpStore
          enum:
          - PickUpStore
          - Home
          - BoxReg
          - BoxUnreg
          - PickUpPoint
          - Own
          - Postal
          - DHLPackstation
          - Digital
          - Undefined
        tracking_number:
          type: string
          description: Tracking number for the shipment.
          example: '123456789'
        tracking_uri:
          type: string
          description: URI where the customer can track their shipment.
          example: https://www.dhl.com/de/express/sendungsverfolgung.html?brand=DHL&AWB=123456789
        return_shipping_company:
          type: string
          description: Name of the shipping company for the return shipment (as specific as possible).
          example: DHL US
        return_tracking_number:
          type: string
          description: Tracking number for the return shipment.
          example: '123456789'
        shipping_delay:
          type: integer
          description: Delay before the order will be shipped.
          format: int64
          example: 5
    CreditCard:
      required:
      - expiry_date
      - number
      type: object
      properties:
        number:
          maxLength: 19
          minLength: 10
          pattern: '[0-9]*'
          type: string
          description: The credit card number (Primary Account Number). It is sometimes masked in response messages, for example 411111******1111.
          example: '41111111111111111'
        expiry_date:
          $ref: '#/components/schemas/ExpiryDate'
        code:
          maxLength: 4
          minLength: 3
          pattern: '[0-9]*'
          type: string
          description: Card verification number of the credit card (also CVV or CVC).
          example: '332'
        cardholder:
          maxLength: 27
          minLength: 1
          type: string
          description: The holder of a credit card.
          example: Max Muster
      description: Information about a credit card.
    AccountInformation:
      type: object
      properties:
        account_change_date:
          type: string
          description: Date of the last change to the client's account. This includes changes to the billing or shipping addresses, new payment methods or new users added.
          format: date
          example: '2021-10-25'
        account_creation_indicator:
          type: string
          description: 'What kind of account is it?


            * GUEST

            * NEW_ACCOUNT

            * EXISTING_ACCOUNT

            '
          example: GUEST
          enum:
          - GUEST
          - NEW_ACCOUNT
          - EXISTING_ACCOUNT
        account_id:
          type: string
          description: The account ID.
          example: MC_ACC_12345678
        account_opened_date:
          type: string
          description: Date the client opened the account. This usually only applies if this is an EXISTING_ACCOUNT.
          format: date
          example: '2021-10-25'
        modification_indicator:
          type: string
          description: 'This field is applicable only if this is an EXISTING_ACCOUNT.


            * ACCOUNT_UPDATED_NOW

            * ACCOUNT_UPDATED_PAST

            '
          example: ACCOUNT_UPDATED_NOW
          enum:
          - ACCOUNT_UPDATED_NOW
          - ACCOUNT_UPDATED_PAST
        password_change_date:
          type: string
          description: Date the client last changed the account's password. May be empty if the password has not been changed yet.
          format: date
          example: '2021-10-25'
        password_change_indicator:
          type: string
          description: 'This field is applicable only if this is an EXISTING_ACCOUNT.


            * PASSWORD_CHANGED_NOW

            * PASSWORD_CHANGED_PAST

            * PASSWORD_NEVER_CHANGED

            '
          example: PASSWORD_CHANGED_NOW
          enum:
          - PASSWORD_CHANGED_NOW
          - PASSWORD_CHANGED_PAST
          - PASSWORD_NEVER_CHANGED
        payment_account_date:
          type: string
          description: Only applicable if PAYMENT_ACCOUNT_EXISTS.
          format: date
          example: '2021-10-25'
        payment_account_history:
          type: string
          description: 'This field is applicable only if this is a NEW_ACCOUNT or EXISTING_ACCOUNT.


            * PAYMENT_ACCOUNT_EXISTS

            * PAYMENT_ACCOUNT_ADDED_NOW

            '
          example: PAYMENT_ACCOUNT_EXISTS
          enum:
          - PAYMENT_ACCOUNT_EXISTS
          - PAYMENT_ACCOUNT_ADDED_NOW
        add_card_attempts:
          maximum: 999
          type: integer
          description: Number of add card attempts during the last 24 hours.
          format: int32
          example: 1
        provisioning_day_count:
          maximum: 9999
          type: integer
          description: The provisioning day counter.
          format: int32
          example: 1
        purchases_six_month_count:
          maximum: 9999
          type: integer
          description: Number of purchases with this account during the previous six months.
          format: int32
          example: 2
        shipping_address_first_use_date:
          type: string
          description: Date when the shipping address was first used for this transaction. Only applies if firstUseOfShippingAddress is false and this is not a guest account.
          format: date
          example: '2021-10-25'
        shipping_address_first_use:
          type: boolean
          description: Applicable if this is not a guest account.
          example: false
        shipping_name_indicator:
          type: string
          description: The shipping name indicator. Indicates if the account's cardholder name equals the shipping name used for this transaction.
          example: '02'
        suspicious_account_activity:
          type: boolean
          description: Indicates whether the merchant experienced suspicious activity (including previous fraud) on the account.
          example: false
        transactions_day_count:
          maximum: 999
          type: integer
          description: Number of transactions (successful or abandoned) of this account during the last 24 hours.
          format: int32
          example: 1
        transactions_year_count:
          maximum: 9999
          type: integer
          description: Number of transactions (successful or abandoned) of this account during the last 365 days.
          format: int32
          example: 1
      description: Information on a user's account usage, payment history, transaction statistics.
    MandateResponse:
      required:
      - signed_on
      type: object
      properties:
        mandate_id:
          maxLength: 32
          minLength: 32
          type: string
          description: Unique identification of the SEPA mandate. Use it for managed and already created mandates.
          example: 89c3d6b532be80339839f1605201f2c7
        signed_on:
          type: string
          description: Date when the SEPA mandate was issued. Full-date notation as defined by RFC 3339, section 5.6.
          format: date
          example: '2017-01-01'
    BasketExtensions:
      type: object
      properties:
        paypal_data:
          $ref: '#/components/schemas/BasketPayPalData'
      description: Service specific basket fields.
    PaymentResponse:
      required:
      - event_id
      - message
      - rc
      - timestamp
      - tx_id
      type: object
      properties:
        rc:
          type: string
          description: Response code of the transaction. "0" in the case of a successful transaction. Other values signify errors.
          example: '0'
        message:
          type: string
          description: Success or error message, text for the response code.
          example: Transaction approved.
        event_id:
          maxLength: 50
          minLength: 1
          pattern: '[\/0-9a-zA-Z_.:,\-+*$%]+'
          type: string
          description: A unique ID for the event.
          example: E5686585867636541231230
        tx_id:
          type: string
          description: Unique transaction identifier. Can be used to reference this transaction.
          example: 020LMG10jxSI8FN0OC4vLR
        riskmanagement_info:
          $ref: '#/components/schemas/RiskmanagementInfoResponse'
        amount_total:
          $ref: '#/components/schemas/AmountCurrency'
        kind:
          type: string
          description: The type of transaction.
          enum:
          - DIRECTDEBIT
          - CREDITCARD
          - CREDITCARD_3DS20
          - CREDITTRANSFER
          - SOFORTUEBERWEISUNG
          - PAYPAL
          - PAYDIREKT
          - WECHATPAY
          - P24
          - GIROPAY
          - KLARNA
          - PSD2
