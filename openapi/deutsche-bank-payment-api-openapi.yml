          example: 221f56ca355d8e6c42517749cf79ceb8
        action:
          type: string
          description: What should be done.
          enum:
          - CREATE
          - UPDATE
          - USE
      description: Specifies an alias and an operation to perform on it.
    MeansOfPaymentDirectDebit:
      type: object
      properties:
        token:
          maxLength: 500
          minLength: 0
          pattern: '[a-zA-Z0-9/+=_-]*'
