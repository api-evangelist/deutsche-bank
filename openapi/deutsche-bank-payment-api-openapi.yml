          $ref: '#/components/schemas/AmountCurrency'
        alias_action:
          $ref: '#/components/schemas/AliasAction'
        aid:
          maxLength: 32
          minLength: 0
          type: string
          description: Approval number of authorizing party.
          example: a34232
        means_of_payment:
          $ref: '#/components/schemas/MeansOfPaymentCreditCard'
        recurring_payment:
          maxLength: 50
          minLength: 1
          pattern: '[/0-9a-zA-Z_.:,+*$%-]+'
          type: string
          description: Identifier of a recurring credit card payment.
          example: 07H987Tx3PF9VxL5G7RfNp
        series_flag:
          type: string
          description: 'Designates a payment as part of a series of payments.


            * `INSTALMENT`: for example in the case of paying a fixed sum in multiple partial payments.

            * `RECURRING`: for example in the case of a subscription or standing order.

            * `UCOF`: when a card number alias is created for future payments with the same credit card. In this case use _alias_action_ with _action_ `CREATE` with the first payment and the card number alias with the following payments. You can use the _tx_action_ `verify-mop` with the first UCOF transaction to register a card number alias without a payment.'
          enum:
          - INSTALMENT
          - RECURRING
          - UCOF
        sequence_type:
          type: string
          description: "If this payment is part of a sequence of payments\n\n * `FIRST`: first payment of a sequence\n * `RECURRING`: follow-up payment\n * `FINAL`: last payment of a sequence\n"
          enum:
          - FINAL
          - FIRST
          - RECURRING
        entry_channel:
          type: string
          description: "Indicates the channel where the credit card data is recorded. The transaction is \n         processed as an eCommerce transaction if no value is set.\n\n * `ECOM`: eCommerce\n * `MOTO`: Mail Order/Telephone Order\n"
          enum:
          - ECOM
          - MOTO
        tds_external_data:
          $ref: '#/components/schemas/TDSExternalData'
        processing_options:
          type: array
          description: Defines an additional processing option for credit card.
          example:
          - RISKCHECK
          items:
            type: string
            description: "Additional processing option for a credit card transaction.\n\n* `RISKCHECK`: before the transaction a risk check is performed. Only available if this \noption has been activated for the shop.\n    "
            example: RISKCHECK
            enum:
            - RISKCHECK
    RiskCheckPassenger:
