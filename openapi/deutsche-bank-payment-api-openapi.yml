          $ref: '#/components/schemas/TransactionBankAccountInfo'
        mandate_data:
          $ref: '#/components/schemas/MandateResponse'
        back_state:
          type: string
          description: "State of a transaction according to the response of a backend system. \n         This value is available on some backend systems.  The use of this field requires an explicit activation. Please contact customer support.  Possible values:\n        \n* `DECLINED`\n* `AUTHORIZED`\n* `REVERSED`\n* `CAPTURED`\n* `SETTLED`\n"
          example: REVERSED
          enum:
          - DECLINED
          - AUTHORIZED
          - REVERSED
          - CAPTURED
          - SETTLED
        ip_address:
          type: string
          description: The customer's IP address associated with this transaction.  The use of this field requires an explicit activation. Please contact customer support.
    Quantity:
      required:
      - quantity_amount
      - quantity_unit
      type: object
      properties:
        quantity_amount:
          minimum: 0
          type: integer
          description: Amount of units.
          format: int64
          example: 5
        quantity_unit:
          maxLength: 8
          minLength: 0
          type: string
          description: Unit used to describe the quantity.
          example: pcs
      description: A quantity.
    BasketItemPayPalData:
      required:
      - paypal_type
      type: object
      properties:
        paypal_type:
          type: string
          description: "PayPal specific type of an order item.\n\n    * `DIGITAL_GOODS`: Goods that are stored, delivered, and used in electronic format.\n    * `PHYSICAL_GOODS`: A tangible item that can be shipped with proof of delivery.\n    * `DONATION`: A contribution or gift for which no good or service is exchanged.\n    "
          example: PHYSICAL_GOODS
          enum:
          - DIGITAL_GOODS
          - PHYSICAL_GOODS
          - DONATION
      description: Service specific basket item fields for PayPal.
    PaymentDiagnosisResponse:
      required:
      - event_id
      - message
      - rc
      - timestamp
      - tx_id
