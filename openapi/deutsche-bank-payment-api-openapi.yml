        tx_id:
          type: string
          description: Unique transaction identifier. Can be used to reference this transaction.
          example: 020LMG10jxSI8FN0OC4vLR
        riskmanagement_info:
          $ref: '#/components/schemas/RiskmanagementInfoResponse'
        amount_total:
          $ref: '#/components/schemas/AmountCurrency'
        kind:
          type: string
          description: The type of transaction.
          enum:
          - DIRECTDEBIT
          - CREDITCARD
          - CREDITCARD_3DS20
          - CREDITTRANSFER
          - SOFORTUEBERWEISUNG
          - PAYPAL
          - PAYDIREKT
          - WECHATPAY
          - P24
          - GIROPAY
          - KLARNA
          - PSD2
        tx_action:
          type: string
          description: The action of a transaction.
          enum:
          - authorization
          - capture
          - credit
          - preauthorization
          - refund
          - reversal
          - risk_check
          - verify-mop
          - payment
          - avs
          - avspayment
        alias_info:
          $ref: '#/components/schemas/AliasInfo'
        back_rc:
          maxLength: 255
          minLength: 0
          type: string
          description: Response code of a backend system, for example the GICC response code.
          example: '00'
        timestamp:
          type: string
          description: Timestamp of the transaction.
          format: date-time
        transaction_info:
          $ref: '#/components/schemas/TransactionInfo'
        children:
          type:
