      - Transaction Subscription
      summary: Gets all transaction subcriptions
      description: Gets all transaction subcriptions for the current user
      operationId: transactionsGet
      parameters:
      - name: iban
        in: query
        description: IBAN representing an account of the current user.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 34
          minLength: 0
          type: string
      - name: limit
        in: query
        description: the number of items of a page.
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: offset
        in: query
        description: the page to be returned.
        required: false
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: Correlation-Id
        in: header
        description: Free form key controlled by the caller e.g. uuid
        required: false
        schema:
          maxLength: 50
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultSubscription'
        '401':
          description: Unsuccessful operation, returns http status 401. See 'example' property for possible values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
              - code: 401
                message: The requested function requires a SCA Level Authentication.
        '500':
