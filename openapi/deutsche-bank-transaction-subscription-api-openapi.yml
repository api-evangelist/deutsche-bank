components:
  schemas:
    SubscriptionPatch:
      title: SubscriptionPatch
      required:
      - subscriptionDetails
      type: object
      properties:
        subscriptionDetails:
          $ref: '#/components/schemas/SubscriptionPatchSubscriptionDetails'
    SubscriptionDetails:
      title: SubscriptionDetails
      required:
      - notificationURL
      - subscriptionType
      type: object
      properties:
        expirationDate:
          type: string
          description: 'The date, when a subscription expires. Format: YYYY-MM-DD'
          format: date
        isActive:
          type: boolean
        notificationURL:
          type: string
          description: The URL the notification will be passed towards.
          format: url
        subscriptionType:
          type: string
          description: Type of subscription
          enum:
          - one-time
          - recurring
      description: Subscription details
    SubscriptionPost:
      title: SubscriptionPost
      type: object
      properties:
        filterCriteria:
          $ref: '#/components/schemas/SubscriptionFilterCriteria'
        subscriptionDetails:
          $ref: '#/components/schemas/SubscriptionPostDetails'
    PagedResultSubscription:
      title: PagedResultSubscription
      required:
      - items
      - totalItems
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        totalItems:
          minimum: 0
          type: integer
          description: Total number of items found for your request parameters over all pages of the pagination.
          format: int32
    SubscriptionPatchSubscriptionDetails:
      title: SubscriptionPatchSubscriptionDetails
      required:
      - expirationDate
      type: object
      properties:
        expirationDate:
          type: string
          description: 'The date, when a subscription expires. Format: YYYY-MM-DD'
          format: date
      description: Subscription details
    SubscriptionPostDetails:
      title: SubscriptionPostDetails
      required:
      - notificationURL
      - subscriptionType
      type: object
      properties:
        expirationDate:
          type: string
          description: 'The date, when a subscription expires. Format: YYYY-MM-DD'
          format: date
        notificationURL:
          type: string
          description: The URL the notification will be passed towards.
          format: url
        subscriptionType:
          type: string
          description: Type of subscription?
          enum:
          - one-time
          - recurring
      description: Subscription details
    ErrorResponse:
      title: ErrorResponse
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: integer
          description: The error code
          format: int32
        message:
          type: string
          description: Description of the belonging error code.
        messageId:
          type: string
          description: dbAPI internal message-id (unique identifier) that allow reference to each of your API calls.
      description: Default error response message
    SubscriptionFilterCriteria:
      title: SubscriptionFilterCriteria
      required:
      - iban
      type: object
      properties:
        iban:
          type: string
          description: IBAN of the account to subscribe to.
        incoming:
          type: boolean
          description: true, if events shall be filtered for incoming transactions, false if not.
        maxAmount:
          type: number
          description: events will be filtered for a transactions amount, absolute values only.
        minAmount:
          type: number
          description: events will be filtered for a transaction amount, absolute values only.
        outgoing:
          type: boolean
          description: true, if events shall be filtered for outgoing transactions, false if not.
      description: Filter criteria
    Subscription:
      title: Subscription
      type: object
      properties:
        filterCriteria:
          $ref: '#/components/schemas/SubscriptionFilterCriteria'
        id:
          type: string
          description: ID of the resource
        subscriptionDetails:
          $ref: '#/components/schemas/SubscriptionDetails'
    ActivationDTO:
      title: ActivationDTO
      type: object
      properties:
        activationCode:
          type: string
  securitySchemes:
    api_auth_code:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://simulator-api.db.com:443/gw/oidc/oauth2/authorize
          tokenUrl: https://simulator-api.db.com:443/gw/oidc/oauth2/token
          scopes:
            transaction_notifications: Enable the transaction subscription feature
            openid: Request access to OpenId Connect functionality
            investments_orders_status_notification: Enable the investments orders subscription feature
            offline_access: Request an OAuth2 Refresh Token
    api_db_smart_access:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://simulator-api.db.com:443/gw/oidc/oauth2/token
          scopes:
            transaction_notifications: Enable the transaction subscription feature
            investments_orders_status_notification: Enable the investments orders subscription feature
