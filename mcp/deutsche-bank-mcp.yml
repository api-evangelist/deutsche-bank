specification: API Commons MCP
specificationVersion: '0.1'
provider: Deutsche Bank
providerId: deutsche-bank
generated: '2026-09-06'
method: derived
status: candidate
source: openapi/ (36 first-party Deutsche Bank OpenAPI 3.0.x documents)
description: >-
  Deutsche Bank ships NO Model Context Protocol server. This is a DERIVED candidate tool
  surface, computed from the read-safe operations in Deutsche Bank's own published OpenAPI
  contracts so the shape of a future server is on record. Nothing here is callable today and
  no endpoint below is a real URL.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: derived
search_evidence:
  - probe: POST tools/list https://mcp.db.com/mcp
    result: DNS does not resolve
  - probe: POST tools/list https://developer.db.com/mcp
    result: 403 (portal edge), no JSON-RPC response
  - probe: POST tools/list https://simulator-api.db.com/mcp
    result: 404
  - probe: POST tools/list https://api.db.com/mcp
    result: 404
  - probe: /.well-known/ai-plugin.json on every known host
    result: 404 everywhere except the developer.db.com SPA catch-all, which returns the HTML shell
  - probe: developer.db.com portal bundle and CMS content searched for "mcp"
    result: no reference
