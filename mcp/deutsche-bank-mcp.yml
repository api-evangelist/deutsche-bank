excluded_from_candidate_surface:
  reason: >-
    Every money-moving and account-creating operation is deliberately left out of the candidate
    tool list. Payment initiation, direct debit, order entry, account opening, loan document
    commit and subscription creation all require PSD2 strong customer authentication (an OTP
    header sourced from the Transaction Authorization API) and, in most cases, an
    idempotency-id. They should not be exposed as autonomous agent tools without an explicit
    human-in-the-loop escalation contract.
  operations:
    - performPaymentInstant
    - sepaCreditTransfer POST /
    - sepaDirectDebit POST /
    - orderEntry
    - bulkOrderEntry
    - cashAccountOpenings
    - espSecuritiesAccountOpening
    - notifyDocumentsUpload
    - createProcessingOrders
    - transactionsPost
    - investmentsOrdersPost
auth_model:
  detail: >-
    Any real server would have to carry an OAuth 2.0 authorization-code flow per end user
    against https://api.db.com (or the simulator), request the scope each tool needs, and pass
    a Correlation-Id per call. Client-credentials scopes exist but only cover the db Smart
    Access corporate product.
  scopes: scopes/deutsche-bank-scopes.yml
